services:
  postgres:
    image: postgres:16-alpine
    container_name: tashbags-db
    environment:
      POSTGRES_USER: tashbags
      POSTGRES_PASSWORD: tashbags
      POSTGRES_DB: tashbags
    ports:
      - "5432:5432"
    volumes:
      - tashbags_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tashbags -d tashbags"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  tashbags_pgdata: